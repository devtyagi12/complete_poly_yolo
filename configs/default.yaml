# ── YOLOv8-Extended default configuration ────────────────────────────────────
# Every value here can be overridden on the CLI or by --cfg your_config.yaml

model:
  model_size:      "s"       # n / s / m / l / x
  num_classes:     80
  angle_step:      15        # degrees per polygon bin  (num_angles = 360//angle_step)
  num_dist_blocks: 1         # ConvBN layers in distance head before final 1x1
  min_distance:    0.5       # metres – clip lower bound for log-distance
  max_distance:    200.0     # metres – clip upper bound for log-distance
  gpu_type:        "nvidia"  # "nvidia" → BatchNorm2d  |  "amd" → GroupNorm
  pretrained:      true      # load official YOLOv8 backbone+neck weights

data:
  # ── polygon datasets (required) ────────────────────────────────────────────
  # Option A – single root (most common):
  poly_dataset_root: "data/polygon"
  # Option B – multiple roots with weights (overrides poly_dataset_root):
  #   poly_datasets:
  #     - "data/poly1/images/train:data/poly1/labels/train"
  #     - "data/poly2/images/train:data/poly2/labels/train"
  #   poly_weights: [2.0, 1.0]   # relative sampling weights
  poly_datasets: []
  poly_weights:  []

  # ── distance dataset (optional) ────────────────────────────────────────────
  # Leave empty string "" to disable.
  dist_dataset_root: ""

  # ── class names (for visualisation) ───────────────────────────────────────
  class_names: []

  img_size:    640
  mosaic_prob:  1.0
  hsv_h:        0.015
  hsv_s:        0.7
  hsv_v:        0.4
  flip_lr_prob: 0.5
  batch_size:  16
  num_workers: 4

train:
  epochs:        300
  warmup_epochs: 3
  lr0:           0.01
  lrf:           0.01
  momentum:      0.937
  weight_decay:  0.0005
  # loss gains
  box_gain:        7.5
  cls_gain:        0.5
  dfl_gain:        1.5
  poly_gain:       0.1
  dist_gain:       0.1
  poly_dist_gain:  2.0
  poly_conf_gain:  0.2
  poly_angle_gain: 0.5
  # runtime
  device:       "cuda"
  save_dir:     "runs/train"   # actual dir = runs/train/exp1, exp2, …
  val_interval: 5
  conf_thres:   0.5
  iou_thres:    0.45
  # logging / visualisation
  log_interval:   10
  vis_interval:   1
  vis_max_images: 8
  tensorboard:    true
